# 12 зон исследования для MVP: декларация по УСН и КУДиР у селлеров маркетплейсов (РФ).
# Одна зона = один исследователь + один верификатор. Зоны не должны пересекаться.
# must_cover — это ВОПРОСЫ, а не факты: числа и нормы агент обязан найти на первоисточнике.
# scope: primary (ФНС/Минфин/КонсультантПлюс/суды) | marketplace (оферты WB/Ozon/ЯМ) | any

zones:
  - id: usn-regime-and-limits
    title: Право на УСН, объекты, ставки и лимиты
    question: >
      Какие условия применения УСН действуют в налоговом году, при каких событиях право
      теряется и какие ставки применяются (базовые, региональные, повышенные)?
    must_cover:
      - Лимиты дохода, численности, остаточной стоимости ОС; коэффициент-дефлятор на год; отдельно для ИП и ООО
      - Дополнительные условия для организаций (доля участия, филиалы) и когда они ограничивают селлера-ООО
      - Базовые ставки для обоих объектов, право регионов снижать, повышенные ставки при превышении порогов
      - Порядок и сроки уведомления о переходе, смене объекта и утрате права
      - Что происходит с налогом и отчётностью в квартале, когда лимит превышен
    tags: [regime, rates]

  - id: usn-declaration-form-and-deadlines
    title: Форма декларации по УСН, порядок заполнения и сроки
    question: >
      Какая форма декларации по УСН (КНД) действует для отчётности за налоговый год, как её
      заполнять и какие сроки подачи и уплаты у ИП и ООО?
    must_cover:
      - Актуальная форма и формат (приказ ФНС), с какой отчётности применяется, что менялось
      - Какие разделы заполняются при объекте «доходы» и «доходы минус расходы», что в каких строках
      - Сроки подачи за год для ИП и ООО; правило переноса на рабочий день
      - Сроки уплаты налога за год и авансовых платежей; роль ЕНС и уведомления об исчисленных суммах
      - Способы подачи и когда обязателен электронный формат
    tags: [form, deadlines]

  - id: usn-income-recognition-marketplaces
    title: Признание доходов у селлера на маркетплейсе (УСН)
    question: >
      Какие суммы и в какую дату селлер на УСН признаёт доходом при продаже через
      маркетплейс, и какие здесь типичные ошибки бухгалтеров?
    must_cover:
      - "Кассовый метод: момент признания дохода, в частности при поступлении выплат от маркетплейса"
      - Что является доходом селлера — полная стоимость реализации покупателям или сумма выплаты за вычетом удержаний; разъяснения Минфина и ФНС и судебная практика
      - Как маркетплейс квалифицируется по договору (агент, комиссионер, иное) и как это влияет на доход принципала
      - "Возвраты, отказы покупателей, корректировки: в каком периоде и как отражать"
      - Компенсации, штрафы, доплаты и прочие суммы от маркетплейса; авансы и резервы
    tags: [income, marketplaces]

  - id: usn-expenses-income-minus-expenses
    title: Расходы на УСН «доходы минус расходы» и минимальный налог
    question: >
      Какие расходы селлера можно учесть на УСН «доходы минус расходы», в какой момент и
      как работают минимальный налог и перенос убытков?
    must_cover:
      - Закрытый перечень расходов и критерии обоснованности; документальное подтверждение
      - "Момент признания: закупка товара, оплата поставщику, реализация"
      - Комиссии, логистика, хранение, реклама, штрафы и возвраты маркетплейса — какие учитываются и на каких условиях
      - "Минимальный налог: порог, когда платится, как соотносится с авансами"
      - Перенос убытков прошлых лет и ограничение по базе
    tags: [expenses, min-tax]

  - id: kudir-form-and-keeping
    title: "КУДиР: форма, порядок ведения и типичные ошибки"
    question: >
      Как ведётся Книга учёта доходов и расходов при УСН, какая форма действует, как в ней
      отражаются операции селлера и какие ошибки в КУДиР приводят к штрафам?
    must_cover:
      - Действующая форма и порядок заполнения (приказ Минфина), разделы, обязательные реквизиты
      - Электронный и бумажный формат, хранение, требование предъявления по запросу
      - Как отразить в КУДиР выплаты маркетплейса, удержания, возвраты — по разъяснениям и практике
      - "Связь КУДиР и декларации: какие показатели обязаны совпадать"
      - Ответственность за грубое нарушение правил учёта; что считается ошибкой, влияющей на налог
    tags: [kudir]

  - id: usn-contributions-and-tax-reduction
    title: Страховые взносы и уменьшение налога по УСН
    question: >
      Какие взносы и в каких пределах уменьшают налог по УСН «доходы» у ИП и ООО, в какие
      сроки и с какими ограничениями?
    must_cover:
      - Фиксированные взносы ИП на год и взнос с дохода свыше порога; предельная сумма
      - "Предельная доля уменьшения налога: ИП без работников, ИП с работниками, организации"
      - В какой период взносы можно учитывать (уплачено, а не начислено) и срок уплаты взноса с дохода
      - Как взносы отражаются в декларации; порядок учёта по кварталам
      - "Взносы за работников и пособия: что уменьшает налог"
    tags: [contributions]

  - id: vat-and-usn-interaction
    title: "НДС для плательщиков УСН: пороги, утрата освобождения, влияние на декларацию"
    question: >
      Когда плательщик УСН становится плательщиком НДС, какие пороги действуют по годам и как
      это отражается на отчётности и расчётах селлера?
    must_cover:
      - Порог дохода для освобождения от НДС по годам; что считается в пороге
      - Порядок утраты освобождения, сроки, ставки НДС и право выбора пониженных ставок
      - Как НДС влияет на доход по УСН и на цены/выплаты маркетплейса
      - Подача уведомления и ответственность за пропуск
    tags: [vat]

  - id: marketplace-contracts-and-reports
    title: Договоры и отчёты WB, Ozon, Яндекс Маркета для налогового учёта
    question: >
      Какие договорные модели и отчётные документы используют WB, Ozon и Яндекс Маркет и
      какие из них являются первичкой для УСН?
    must_cover:
      - Правовая природа договора по публичным офертам площадок
      - Состав и периодичность отчётов (реализация, комиссионное вознаграждение, акты, УПД) и что они удостоверяют
      - Срок и порядок выплат; даты, влияющие на кассовое признание дохода
      - Как оформляются возвраты, логистика, хранение, штрафы, компенсации
      - Что можно взять из личного кабинета как подтверждение дохода и расходов
    scope: marketplace
    tags: [marketplaces, primary-docs]

  - id: platform-economy-data-exchange-and-audit
    title: Передача данных маркетплейсов в ФНС и камеральные проверки УСН
    question: >
      Какие данные о продавцах маркетплейсы передают в ФНС, как налоговая сверяет их с
      декларациями и как проходят камеральные проверки УСН?
    must_cover:
      - "Закон о платформенной экономике: даты вступления, обязанности площадок по передаче сведений"
      - Какие показатели ФНС сравнивает с декларацией селлера; типичные основания требований пояснений
      - Порядок камеральной проверки декларации по УСН, сроки и документы
      - Налоговая нагрузка и другие критерии отбора для проверок
    tags: [audit, risks]

  - id: ip-vs-ooo-reporting-specifics
    title: "ИП и ООО на УСН: различия в отчётности и учёте"
    question: >
      Чем отличаются обязанности ИП и ООО на УСН в части декларации, КУДиР и сопутствующей
      отчётности и какие ошибки характерны для каждого статуса?
    must_cover:
      - "Сроки подачи и уплаты: ИП против ООО"
      - Бухгалтерская отчётность организаций на УСН, что обязательно
      - "Особенности учёта у ИП: личные и бизнес-платежи, расчётный счёт, КУДиР"
      - Налоги и отчёты по работникам и их связь с вычетом взносов
    tags: [ip, ooo]

  - id: penalties-limitation-self-correction
    title: Штрафы, пени, сроки давности и самоисправление
    question: >
      Какие санкции грозят за нарушения по декларации и КУДиР, как считаются пени и как
      исправить ошибку до проверки?
    must_cover:
      - Штрафы за непредставление, несвоевременное представление, неуплату, грубое нарушение учёта; размеры и условия смягчения
      - "Расчёт пеней: ставка, периоды"
      - Сроки давности привлечения и доначисления
      - "Уточнённая декларация: когда освобождает от ответственности, условия"
    tags: [penalties]

  - id: court-practice-marketplaces-usn
    title: Судебная практика по УСН селлеров маркетплейсов
    question: >
      Какие позиции Верховного суда и окружных судов по доходам, расходам и признанию
      операций селлеров на маркетплейсах устоялись?
    must_cover:
      - "Споры о размере дохода: выплата или реализация; ссылки на конкретные акты"
      - Споры о расходах (комиссии, логистика, штрафы)
      - Позиции по дроблению бизнеса и утрате права на УСН у селлеров
      - Разъяснения ФНС и Минфина, на которые опираются суды
    tags: [court]
