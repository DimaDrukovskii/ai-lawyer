[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-lawyer"
version = "0.1.0"
description = "Налоговый second opinion для селлеров маркетплейсов на УСН (РФ): мультиагентный research + проверка декларации и КУДиР"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "defusedxml>=0.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
lawyer = "lawyer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lawyer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# длинные строки остаются только внутри строковых литералов (XML-фикстуры, русский текст);
# за остальное отвечает ruff format
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/lawyer/api.py" = ["B008"]  # File(...)/Form(...) в аргументах — штатный паттерн FastAPI
